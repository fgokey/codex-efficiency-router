name: maintenance-snapshot
on:
  push:
    branches: [fix/offline-hardening-v021]
    paths: [.github/workflows/maintenance-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export public source history only
        run: git bundle create source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-snapshot
          path: source.bundle
          retention-days: 1
          if-no-files-found: error
