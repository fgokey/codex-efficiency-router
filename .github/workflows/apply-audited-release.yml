name: apply-audited-release

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/codex-efficiency-router-v0.2.0.tar.gz"
      - ".github/workflows/apply-audited-release.yml"

permissions:
  contents: write

concurrency:
  group: apply-audited-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate audited release
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .bootstrap/codex-efficiency-router-v0.2.0.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-audited-release.yml
          chmod +x install.sh uninstall.sh scripts/*.py
          rm -rf scripts/__pycache__ tests/__pycache__
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/doctor.py --source-tree .
          sh -n install.sh uninstall.sh
          test -x install.sh && test -x uninstall.sh
          git diff --check
          rm -rf scripts/__pycache__ tests/__pycache__

      - name: Commit audited release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: audit and optimize routing against OpenAI guidance"
          git push origin HEAD:main
