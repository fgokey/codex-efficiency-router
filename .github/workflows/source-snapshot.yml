name: source-snapshot
on:
  push:
    branches: [audit/experience-source-20261023]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked source history only
        run: git bundle create "${RUNNER_TEMP}/source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: experience-source-snapshot
          path: ${{ runner.temp }}/source.bundle
          retention-days: 1
