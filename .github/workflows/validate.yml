name: validate

on:
  push:
    branches: [main, fix/offline-hardening-v021]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q scripts tests evaluation
      - name: Regression, ownership and documented CLI contracts
        run: python -m unittest discover -s tests -v
      - name: Static source validation (not live model execution)
        run: python scripts/doctor.py --source-tree .

  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned text tokenizer (no model inference)
        run: python -m pip install tiktoken==0.11.0
      - name: Retained boundaries, mutation detection and full instruction token budget
        run: python evaluation/offline_audit.py
      - name: Preserve report and failing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-quality-token-audit
          path: evaluation-results/
          if-no-files-found: error
          retention-days: 14
