name: validate

on:
  push:
    branches: [main, fix/offline-hardening-v021, quality/codex-v030, feature/adaptive-effort-v040, feature/automatic-routing-v050, fix/astra-write-gate-v060, feature/verifiable-guard-v070]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned offline schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Compile scripts
        run: python -m compileall -q scripts tests evaluation hooks
      - name: Regression, ownership and documented CLI contracts
        run: python -m unittest discover -s tests -v
      - name: Static source validation (not live model execution)
        run: python scripts/doctor.py --source-tree .
      - name: Candidate version, digest and portable Plugin schema
        run: python -B scripts/release_package.py --check --schema
      - name: Build immutable candidate artifact (no native or model calls)
        run: python -B scripts/release_package.py --output candidate.zip
      - name: Verify artifact hashes and rerun its extracted regression tests
        run: python -B scripts/check_artifact.py candidate.zip

  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned text tokenizer (no model inference)
        run: python -m pip install tiktoken==0.11.0
      - name: Retained boundaries, mutation detection and full instruction token budget
        run: python evaluation/offline_audit.py
      - name: Write boundary and active diagnosis mutations
        run: python evaluation/write_audit.py
      - name: Preserve report and failing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-quality-token-audit
          path: evaluation-results/
          if-no-files-found: error
          retention-days: 14

  windows-python310-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: compatible
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        id: old
        with:
          python-version: '3.10'
      - name: Real 3.10 default, explicit 3.12 launcher and read-only preflight
        shell: pwsh
        env:
          CER_PYTHON: ${{ steps.compatible.outputs.python-path }}
          CER_OLD_PYTHON: ${{ steps.old.outputs.python-path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -c "import sys; assert sys.version_info[:2] == (3, 10)"
          if ($LASTEXITCODE -ne 0) { throw 'Expected actual Python 3.10 default' }
          $Project = Join-Path $env:RUNNER_TEMP 'cer bootstrap project'
          New-Item -ItemType Directory -Path $Project | Out-Null
          ./cer.ps1 install --scope project --project-root $Project --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'Compatible explicit runtime was not selected' }
          if (@(Get-ChildItem -Force $Project).Count -ne 0) { throw 'Dry-run wrote files' }
          # Run rejection in a child PowerShell so its expected failure is inspectable.
          $env:CER_PYTHON = $env:CER_OLD_PYTHON
          pwsh -NoProfile -NonInteractive -File ./cer.ps1 install --scope project --project-root $Project
          if ($LASTEXITCODE -eq 0) { throw 'Explicit Python 3.10 was incorrectly accepted' }
          if (@(Get-ChildItem -Force $Project).Count -ne 0) { throw 'Rejected interpreter wrote files' }
          exit 0
