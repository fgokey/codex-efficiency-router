name: Bug report
description: Report a reproducible router, installer, compatibility, or policy problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove secrets, private source code, proprietary logs, and internal URLs before posting.
  - type: input
    id: version
    attributes:
      label: Router version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Install scope
      options: [user, project, source-tree only]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include sanitized task signals or commands where possible.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor/test output
      description: Paste sanitized output from doctor/tests.
